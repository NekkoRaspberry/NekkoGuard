# Fixed project name: containers, networks and volumes keep the same names
# no matter which folder this repo is cloned into.
name: nekkoguard

# Local stack on NekkoRaspberry.
# Uses the shared services already running in k3s:
#   - PostgreSQL: postgres.databases.svc.cluster.local:5432  (Postgres-K3s)
#   - Mailpit:    mailpit.email.svc.cluster.local:1025       (Mailpit-K3s)
#                 web UI: https://mailpit.home.arpa
# Redis still runs as a container here (there is no Redis in k3s yet).
#
# Credentials live in the git-ignored .envs/.local/ folder.
# For a fully self-contained stack (CI, other machines) use docker-compose.development.yml.

volumes:
  nekkoguard_local_redis_data: {}

# Containers resolve k3s service names through the cluster DNS (CoreDNS).
# Container names (redis, django, ...) still resolve through Docker's own DNS.
x-k3s-dns: &k3s-dns
  dns:
    - 10.43.0.10

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/development/django/Dockerfile
    image: nekkoguard_local_django
    container_name: nekkoguard_local_django
    <<: *k3s-dns
    depends_on:
      - redis
    volumes:
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: true
      - path: ./.envs/.local/.postgres
        required: true
    ports:
      - '8000:8000'
    command: /start

  redis:
    image: docker.io/redis:7.2
    container_name: nekkoguard_local_redis
    volumes:
      - nekkoguard_local_redis_data:/data

  celeryworker:
    <<: *django
    image: nekkoguard_local_celeryworker
    container_name: nekkoguard_local_celeryworker
    depends_on:
      - redis
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: nekkoguard_local_celerybeat
    container_name: nekkoguard_local_celerybeat
    depends_on:
      - redis
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: nekkoguard_local_flower
    container_name: nekkoguard_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

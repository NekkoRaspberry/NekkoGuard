name: CI

on:
  pull_request:
    branches: ['main']
    paths-ignore: ['nekkoguard_BE/docs/**', 'nekkoguard_FE/**', 'nekkoguard_specifications/**']

  push:
    branches: ['main']
    paths-ignore: ['nekkoguard_BE/docs/**', 'nekkoguard_FE/**', 'nekkoguard_specifications/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'nekkoguard_BE/.python-version'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nekkoguard_BE

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      # When env files are git-ignored, .envs/.development/* are not in the repo.
      # Create minimal dummy files so Docker Compose / Django / Postgres work in CI.
      - name: Ensure local env files exist for Docker Compose
        run: |
          mkdir -p .envs/.development
          if [ ! -f .envs/.development/.django ]; then
            cat <<'EOF' > .envs/.development/.django
          USE_DOCKER=yes
          IPYTHONDIR=/app/.ipython
          REDIS_URL=redis://redis:6379/0
          CELERY_FLOWER_USER=debug
          CELERY_FLOWER_PASSWORD=debug
          EOF
          fi
          if [ ! -f .envs/.development/.postgres ]; then
            cat <<'EOF' > .envs/.development/.postgres
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=ci
          POSTGRES_USER=debug
          POSTGRES_PASSWORD=debug
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache local backend
        uses: docker/bake-action@v6
        with:
          source: .
          # Run bake inside the backend folder: compose paths (compose/…) are relative to it
          workdir: nekkoguard_BE
          push: false
          load: true
          files: docker-compose.development.yml
          targets: django
          set: |
            django.cache-from=type=gha,scope=django-cached-tests
            django.cache-to=type=gha,scope=django-cached-tests,mode=max
            postgres.cache-from=type=gha,scope=postgres-cached-tests
            postgres.cache-to=type=gha,scope=postgres-cached-tests,mode=max

      - name: Build and cache docs
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: nekkoguard_BE
          push: false
          load: true
          files: docker-compose.docs.yml
          set: |
            docs.cache-from=type=gha,scope=cached-docs
            docs.cache-to=type=gha,scope=cached-docs,mode=max

      - name: Check DB Migrations
        run: docker compose -f docker-compose.development.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f docker-compose.development.yml run --rm django python manage.py migrate

      - name: Run Django Tests
        run: docker compose -f docker-compose.development.yml run django pytest

      - name: Tear down the Stack
        run: docker compose -f docker-compose.development.yml down

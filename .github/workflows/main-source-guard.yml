name: Main source guard

# main mirrors production: it only accepts pull requests coming from dev.
# The job name below is a required status check in the main ruleset.
on:
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  source-is-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from this repository's dev branch (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source is dev — OK"

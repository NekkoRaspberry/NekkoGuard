# Fixed project name: containers, networks and volumes keep the same names
# no matter which folder this repo is cloned into.
name: nekkoguard_docs

services:
  docs:
    image: nekkoguard_development_docs
    container_name: nekkoguard_development_docs
    build:
      context: .
      dockerfile: ./compose/development/docs/Dockerfile
    env_file:
      - path: ./.envs/.development/.django
        required: false
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./nekkoguard:/app/nekkoguard:z
    ports:
      - '9000:9000'
    command: /start-docs

# Fixed project name: containers, networks and volumes keep the same names
# no matter which folder this repo is cloned into.
name: nekkoguard_development

volumes:
  nekkoguard_development_postgres_data: {}
  nekkoguard_development_postgres_data_backups: {}
  nekkoguard_development_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/development/django/Dockerfile
    image: nekkoguard_development_django
    container_name: nekkoguard_development_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - path: ./.envs/.development/.django
        required: false
      - path: ./.envs/.development/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: nekkoguard_production_postgres
    container_name: nekkoguard_development_postgres
    volumes:
      - nekkoguard_development_postgres_data:/var/lib/postgresql/18/docker
      - nekkoguard_development_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.development/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: nekkoguard_development_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8.2
    container_name: nekkoguard_development_redis
    volumes:
      - nekkoguard_development_redis_data:/data

  celeryworker:
    <<: *django
    image: nekkoguard_development_celeryworker
    container_name: nekkoguard_development_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: nekkoguard_development_celerybeat
    container_name: nekkoguard_development_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: nekkoguard_development_flower
    container_name: nekkoguard_development_flower
    ports:
      - '5555:5555'
    command: /start-flower
